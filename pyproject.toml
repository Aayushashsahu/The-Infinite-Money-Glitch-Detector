[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinite-money-glitch-detector"
version = "0.2.0"
description = "Macro-financial research platform - Phase 1: math engine; Phase 2: data infrastructure"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.6",
    "scipy>=1.11",
    "SQLAlchemy>=2.0",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "streamlit>=1.32",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["core", "models", "simulation", "simulation.monte_carlo", "schemas", "data", "data.adapters", "data.db", "backtesting", "dashboard", "dashboard.artifacts", "dashboard.components", "dashboard.components.plots", "dashboard.pages"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]
